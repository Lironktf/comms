# Local ACTP stack: Postgres + anvil + backend.
# Contracts must be deployed against anvil and the addresses set in the environment
# (see README "Local development"). For zero-dependency dev, run the backend without
# DATABASE_URL to use embedded PGlite instead of this Postgres service.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: actp
      POSTGRES_PASSWORD: actp
      POSTGRES_DB: actp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - actp_pg:/var/lib/postgresql/data

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://actp:actp@postgres:5432/actp
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      VENDOR_REGISTRY_ADDRESS: ${VENDOR_REGISTRY_ADDRESS:-}
      ATTESTATION_REGISTRY_ADDRESS: ${ATTESTATION_REGISTRY_ADDRESS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      CONTRACT_EXTRACTOR: ${CONTRACT_EXTRACTOR:-deterministic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8402:8402"

volumes:
  actp_pg:
